<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assets — reel</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="anim-base.css">
<style>
  .ass-bar{ display:flex; align-items:center; margin-bottom:20px; }
  .selector{ display:flex; align-items:center; gap:10px; border:1px solid var(--colors-hairline); border-radius:11px; padding:11px 16px; font-size:15px; font-weight:500; letter-spacing:-0.01em; }
  .export{ margin-left:auto; display:flex; align-items:center; gap:8px; border:1px solid var(--colors-hairline); border-radius:11px; padding:11px 16px; font-size:14px; font-weight:600; }

  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:26px; }
  .kpi{ background:#fff; border:1px solid var(--colors-hairline); border-radius:16px; padding:18px 20px; }
  .kpi-l{ font-size:13px; color:var(--colors-ink-muted-48); letter-spacing:-0.01em; }
  .kpi-v{ margin-top:9px; font-size:30px; font-weight:600; letter-spacing:-0.025em; }
  .kpi-s{ margin-top:7px; font-size:13px; color:var(--colors-ink-muted-48); }
  .kpi-s.up{ color:#1a7a37; font-weight:600; }

  .bottom{ display:grid; grid-template-columns:1fr 400px; gap:28px; align-items:start; }
  .sec-t{ font-size:18px; font-weight:600; letter-spacing:-0.02em; margin-bottom:14px; }
  .htable{ background:#fff; border:1px solid var(--colors-hairline); border-radius:16px; overflow:hidden; }
  .hrow{ display:grid; grid-template-columns:1fr 130px 80px 80px; column-gap:14px; align-items:center; padding:0 20px; height:64px; border-bottom:1px solid var(--colors-divider-soft); }
  .hrow:last-child{ border-bottom:none; }
  .hrow.head{ height:42px; background:#fcfcfd; font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--colors-ink-muted-48); }
  .tick{ display:flex; align-items:center; gap:12px; }
  .tk-chip{ width:38px; height:38px; border-radius:9px; background:var(--colors-canvas-parchment); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; letter-spacing:0.01em; flex:none; }
  .tk-name{ font-size:15px; font-weight:600; letter-spacing:-0.01em; }
  .tk-sec{ font-size:12.5px; color:var(--colors-ink-muted-48); }
  .hval{ text-align:right; font-size:15px; font-weight:600; }
  .hwt{ text-align:right; font-size:14px; color:var(--colors-ink-muted-48); }
  .hday{ text-align:right; font-size:14px; font-weight:600; }
  .hday.up{ color:#1a7a37; } .hday.down{ color:#c4322b; }

  .donutcard{ background:#fff; border:1px solid var(--colors-hairline); border-radius:16px; padding:24px; }
  .donut-wrap{ display:flex; justify-content:center; position:relative; }
  .donut-center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
  .dc-l{ font-size:13px; color:var(--colors-ink-muted-48); }
  .dc-v{ font-size:34px; font-weight:600; letter-spacing:-0.02em; }
  .legend{ margin-top:18px; display:flex; flex-direction:column; gap:11px; }
  .leg{ display:flex; align-items:center; gap:11px; font-size:14px; }
  .leg .lname{ letter-spacing:-0.01em; }
  .leg .lpct{ margin-left:auto; font-weight:600; }
</style>
</head>
<body>
<div class="viewport">
  <div class="stage">
    <div class="reel">
      <div class="page">
        <div class="page-head">
          <div class="page-title">Assets</div>
          <div class="page-sub">NAV, holdings &amp; allocation by fund</div>
        </div>
        <div class="ass-bar">
          <div class="selector">All funds · aggregate book ▾</div>
          <div class="export">⤓ Export</div>
        </div>

        <div class="kpis" id="kpis"></div>

        <div class="bottom">
          <div>
            <div class="sec-t">Top holdings</div>
            <div class="htable" id="htable">
              <div class="hrow head"><div>Security</div><div class="hval">Market value</div><div class="hwt">Weight</div><div class="hday">Day</div></div>
            </div>
          </div>
          <div>
            <div class="sec-t">Sector mix</div>
            <div class="donutcard">
              <div class="donut-wrap">
                <svg width="260" height="260" viewBox="0 0 260 260" id="donut">
                  <g transform="rotate(-90 130 130)" id="segs"></g>
                </svg>
                <div class="donut-center"><div class="dc-l">Sectors</div><div class="dc-v" data-poscount>8</div></div>
              </div>
              <div class="legend" id="legend"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="anim-runtime.js"></script>
<script>
const E=Reel.ease, kf=Reel.kf, step=Reel.step, clamp=Reel.clamp;

const KPIS=[
  { l:'Total NAV', pfx:'$', val:2.84, suf:'B', dec:2, sub:'+3.2% MTD', up:true },
  { l:'Invested', pfx:'$', val:2.44, suf:'B', dec:2, sub:'86% of book' },
  { l:'Cash & equivalents', pfx:'$', val:398.6, suf:'M', dec:1, sub:'14% of book' },
  { l:'Positions', pfx:'', val:42, suf:'', dec:0, sub:'8 sectors' },
];
const HOLD=[
  { tk:'VCB', name:'Vietcombank', sec:'Financials', val:4860800, wt:9.4, day:0.8 },
  { tk:'FPT', name:'FPT Corporation', sec:'Technology', val:4615800, wt:8.9, day:1.6 },
  { tk:'HPG', name:'Hoa Phat Group', sec:'Materials', val:2183000, wt:4.2, day:-0.5 },
  { tk:'MWG', name:'Mobile World', sec:'Cons. discr.', val:1450800, wt:2.8, day:0.3 },
];
const SECTORS=[
  { label:'Financials', v:32, color:'#0066cc' },
  { label:'Technology', v:21, color:'#A9802D' },
  { label:'Fixed income', v:18, color:'#1a8a3c' },
  { label:'Materials', v:12, color:'#9aa0a6' },
  { label:'Consumer', v:11, color:'#5e9bd6' },
  { label:'Energy', v:6, color:'#c9a85c' },
];

// KPI cards
const kc=document.getElementById('kpis');
KPIS.forEach((k,i)=>{ const d=document.createElement('div'); d.className='kpi'; d.dataset.i=i;
  d.innerHTML=`<div class="kpi-l">${k.l}</div><div class="kpi-v"><span data-kv></span></div><div class="kpi-s ${k.up?'up':''}">${k.sub}</div>`;
  kc.appendChild(d); });
const kpiEls=[...kc.querySelectorAll('.kpi')];

// holdings rows
const ht=document.getElementById('htable');
HOLD.forEach((h,i)=>{ const r=document.createElement('div'); r.className='hrow'; r.dataset.i=i;
  r.innerHTML=`<div class="tick"><div class="tk-chip">${h.tk}</div><div><div class="tk-name">${h.name}</div><div class="tk-sec">${h.sec}</div></div></div>
    <div class="hval tnum" data-hv></div><div class="hwt tnum">${h.wt}%</div><div class="hday ${h.day>=0?'up':'down'}">${h.day>=0?'+':''}${h.day}%</div>`;
  ht.appendChild(r); });
const holdEls=[...ht.querySelectorAll('.hrow:not(.head)')];

// donut segments
const C=2*Math.PI*100; // r=100
const segG=document.getElementById('segs');
let acc=0; const segData=[];
SECTORS.forEach((s)=>{
  const len=s.v/100*C;
  const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
  circle.setAttribute('cx','130'); circle.setAttribute('cy','130'); circle.setAttribute('r','100');
  circle.setAttribute('fill','none'); circle.setAttribute('stroke',s.color); circle.setAttribute('stroke-width','30');
  circle.setAttribute('stroke-dasharray','0 '+C);
  circle.setAttribute('transform','rotate('+(acc/100*360)+' 130 130)');
  segG.appendChild(circle); segData.push({el:circle,len});
  acc+=s.v;
});

// legend
const lg=document.getElementById('legend');
SECTORS.forEach((s,i)=>{ const d=document.createElement('div'); d.className='leg'; d.dataset.i=i;
  d.innerHTML=`<span class="dot" style="width:10px;height:10px;background:${s.color}"></span><span class="lname">${s.label}</span><span class="lpct" data-lp></span>`;
  lg.appendChild(d); });
const legEls=[...lg.querySelectorAll('.leg')];

function fmtMoney(v){ return '$'+Math.round(v).toLocaleString('en-US'); }

Reel.start(function(t){
  // KPIs reveal + count
  kpiEls.forEach((el,i)=>{
    const t0=0.3+i*0.1; const p=step(t,t0,t0+0.6,E.out);
    el.style.opacity=p; el.style.transform=`translateY(${(1-p)*16}px)`;
    const k=KPIS[i]; const cp=step(t,t0+0.1,t0+1.5,E.out);
    el.querySelector('[data-kv]').textContent=k.pfx+(k.val*cp).toFixed(k.dec)+k.suf;
  });

  // donut draw
  segData.forEach((s,i)=>{
    const t0=1.1+i*0.28; const p=step(t,t0,t0+0.5,E.out);
    s.el.setAttribute('stroke-dasharray',(s.len*p)+' '+(C-s.len*p));
  });
  // gentle breathe
  const br=1+Math.sin(t*1.1)*0.006;
  document.getElementById('donut').style.transform=`scale(${br})`;

  // legend reveal + pct count
  legEls.forEach((el,i)=>{
    const t0=1.3+i*0.18; const p=step(t,t0,t0+0.5,E.out);
    el.style.opacity=p; el.style.transform=`translateX(${(1-p)*10}px)`;
    const cp=step(t,t0,t0+0.9,E.out);
    el.querySelector('[data-lp]').textContent=Math.round(SECTORS[i].v*cp)+'%';
  });

  // holdings reveal + value count
  holdEls.forEach((el,i)=>{
    const t0=2.4+i*0.2; const p=step(t,t0,t0+0.6,E.out);
    el.style.opacity=p; el.style.transform=`translateY(${(1-p)*14}px)`;
    const cp=step(t,t0+0.1,t0+1.3,E.out);
    el.querySelector('[data-hv]').textContent=fmtMoney(HOLD[i].val*cp);
  });
});
</script>
</body>
</html>
