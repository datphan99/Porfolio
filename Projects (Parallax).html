<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projects — Parallax</title>

<!--
═══════════════════════════════════════════════════════════════════════════════
  COMPONENT DOCS — for converting this file into a React/JSX + Tailwind component
═══════════════════════════════════════════════════════════════════════════════

  Suggested component:  <ProjectsParallax projects={Project[]} headline="..." />

  Project = {
    name: string,
    tag:  string,
    img:  string,   // image URL (or import)
  }

  ── STYLING ──────────────────────────────────────────────────────────────────
  Everything is Tailwind utility classes (arbitrary values for the bespoke bits:
  the mist vignette `after:[box-shadow:inset...]` and the glass pill caption).
  The ONLY custom CSS left is the `.no-anim` fallback block in <style> below —
  it's conditional/`!important` heavy, so it stays as a plain class. When porting
  to JSX, copy those rules into your global stylesheet (or a CSS module) verbatim.

  Design tokens live in tailwind.config (theme.extend) → colors.mist / colors.ink,
  borderRadius.card, spacing.side. Mirror these in your real tailwind.config.js.

  ── JS / ANIMATION (GSAP) ─────────────────────────────────────────────────────
  The whole motion system is one IIFE at the bottom. In React, move it into a
  single useEffect with refs instead of querySelector + cleanup on unmount:

    const rootRef      = useRef(null)   // <section> .projects  (ScrollTrigger trigger)
    const stageRef     = useRef(null)   // [data-stage]         (pin target)
    const statementRef = useRef(null)   // [data-statement]
    const cardRefs     = useRef([])     // each .project figure (push in map)

    useEffect(() => {
      gsap.registerPlugin(ScrollTrigger, ScrollSmoother)
      const smoother = ScrollSmoother.create({ wrapper:'#smooth-wrapper',
                          content:'#smooth-content', smooth:1.4, normalizeScroll:true })
      // …build the render(p) + rAF lerp loop + ScrollTrigger.create exactly as below…
      return () => {                      // cleanup!
        cancelAnimationFrame(raf)
        ScrollTrigger.getAll().forEach(t => t.kill())
        smoother && smoother.kill()
      }
    }, [projects.length])

  Key constants (tweak feel here): MIST_END, FIRST, OVERLAP, lerp ease factor 0.08.
  Render contract is documented inline next to each block.
═══════════════════════════════════════════════════════════════════════════════
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Mirror these in your real tailwind.config.js → theme.extend
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          mist: "#f2f2f0",     // page bg = mist color, so card edges dissolve into it
          ink:  "#15161a",
        },
        borderRadius: { card: "30px" },
        spacing: { side: "clamp(24px, 6vw, 96px)" }, // responsive gutters
        fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
      },
    },
  };
</script>

<style type="text/tailwindcss">
  /* base */
  html, body { margin: 0; }
  body { background: theme(colors.mist); color: theme(colors.ink); -webkit-font-smoothing: antialiased; }
  #smooth-wrapper { overflow: hidden; } /* ScrollSmoother requires this wrapper/content pair */

  /* ── FALLBACK ONLY (no GSAP / reduced-motion) — the one bit not worth doing in
        utilities. Toggled by adding `.no-anim` to <body>. Port verbatim to JSX. ── */
  .no-anim .projects        { min-height: auto; }
  .no-anim .projects-stage  { height: auto; overflow: visible; padding: 18vh 0; }
  .no-anim .statement-layer { position: static; }
  .no-anim .statement       { opacity: 1 !important; filter: none !important; }
  .no-anim .project {
    position: relative; top: auto; left: auto; right: auto;
    margin: 6vh var(--side, clamp(24px,6vw,96px));
    opacity: 1 !important; filter: none !important; transform: none !important;
  }
  .no-anim .project.is-right { margin-left: auto; }
</style>
</head>

<body class="font-sans">

<!-- ScrollSmoother required structure: fixed wrapper + transformed content -->
<div id="smooth-wrapper">
<div id="smooth-content">

  <div class="h-[64vh] grid place-items-center text-neutral-400 text-xs tracking-[0.22em] uppercase">Scroll down ↓</div>

  <!-- min-h drives the pin duration / total sequence length -->
  <section class="projects relative min-h-[680vh]" data-projects data-screen-label="Projects">
    <!-- .projects-stage = the pinned viewport. JS hook: [data-stage] -->
    <div class="projects-stage relative h-screen overflow-hidden" data-stage>

      <p class="absolute top-9 inset-x-0 text-center z-[5] text-[11px] font-medium tracking-[0.24em] uppercase text-neutral-400">Selected Work</p>

      <!-- pinned, centered statement — z-[4], rides IN FRONT of the cards -->
      <div class="statement-layer absolute inset-0 grid place-items-center z-[4] pointer-events-none">
        <h2 class="statement m-0 whitespace-nowrap font-semibold leading-none tracking-[-0.035em] text-ink text-[clamp(30px,5.4vw,62px)] [will-change:filter,opacity,transform]" data-statement>Unforgettable experiences</h2>
      </div>

      <!-- cards injected from data (see PROJECTS below). In JSX: projects.map(...) -->

    </div>
  </section>

  <div class="h-[64vh] grid place-items-center text-neutral-400 text-xs tracking-[0.22em] uppercase">↑ End of selected work</div>

</div><!-- /#smooth-content -->
</div><!-- /#smooth-wrapper -->

<!--
  CARD MARKUP REFERENCE (what the JS builds per project — copy this into your JSX map).
  `is-left` / `is-right` set which gutter the card hugs (odd → right, even → left).
  The mist vignette is the `after:` utilities; the caption is the glass pill.

  <figure class="project is-right absolute top-1/2 z-[2] rounded-card w-[clamp(280px,34vw,512px)] aspect-[512/570]
                 right-side          (or `left-side` for .is-left)
                 [will-change:transform,opacity,filter]
                 after:content-[''] after:absolute after:-inset-px after:z-[3] after:rounded-card after:pointer-events-none
                 after:[box-shadow:inset_0_0_4rem_8rem_theme(colors.mist)]">
    <div class="absolute inset-0 rounded-card overflow-hidden">
      <img src="{img}" alt="{name} — {tag}" class="w-full h-full object-cover" />
    </div>
    <figcaption class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-[4] whitespace-nowrap
                       inline-flex items-baseline gap-[0.55em] px-[0.95em] py-[0.56em] rounded-full text-white
                       bg-[rgba(120,120,120,0.28)] [backdrop-filter:blur(7px)_saturate(1.3)]
                       [box-shadow:inset_0_0_0_1px_rgba(255,255,255,0.22),0_6px_20px_-10px_rgba(0,0,0,0.4)]">
      <b class="text-[15px] font-semibold tracking-[-0.01em]">{name}</b>
      <span class="text-[14px] font-normal opacity-80">{tag}</span>
    </figcaption>
  </figure>
-->

<!-- GSAP core + ScrollTrigger (stable) + ScrollSmoother (trial CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://assets.codepen.io/16327/ScrollSmoother.min.js"></script>
<script>
(function () {
  /* ── project data (swap this array for your JSON / become the `projects` prop) ── */
  var PROJECTS = [
    { name: "San Miguel",  tag: "America's Cup", img: "https://picsum.photos/id/1036/600/670" },
    { name: "Atlas",       tag: "Finance app",   img: "https://picsum.photos/id/1067/600/670" },
    { name: "Helios",      tag: "Brand system",  img: "https://picsum.photos/id/1039/600/670" },
    { name: "Field Notes", tag: "Editorial",     img: "https://picsum.photos/id/1015/600/670" },
    { name: "Northwind",   tag: "Web platform",  img: "https://picsum.photos/id/1043/600/670" }
  ];

  /* These class strings ARE the Tailwind reference above — keep them in sync. */
  var CARD_CLASS =
    "project absolute top-1/2 z-[2] rounded-card w-[clamp(280px,34vw,512px)] aspect-[512/570] " +
    "[will-change:transform,opacity,filter] " +
    "after:content-[''] after:absolute after:-inset-px after:z-[3] after:rounded-card after:pointer-events-none " +
    "after:[box-shadow:inset_0_0_4rem_8rem_theme(colors.mist)]";
  var MEDIA_CLASS = "absolute inset-0 rounded-card overflow-hidden";
  var IMG_CLASS   = "w-full h-full object-cover";
  var CAP_CLASS   =
    "absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-[4] whitespace-nowrap " +
    "inline-flex items-baseline gap-[0.55em] px-[0.95em] py-[0.56em] rounded-full text-white " +
    "bg-[rgba(120,120,120,0.28)] [backdrop-filter:blur(7px)_saturate(1.3)] " +
    "[box-shadow:inset_0_0_0_1px_rgba(255,255,255,0.22),0_6px_20px_-10px_rgba(0,0,0,0.4)]";

  var stage = document.querySelector('[data-stage]');
  var cards = PROJECTS.map(function (p, i) {
    var fig = document.createElement('figure');
    var sideClass = (i % 2 === 0) ? 'is-right right-side' : 'is-left left-side'; /* 1,3,5 → right */
    fig.className = CARD_CLASS + ' ' + sideClass;
    fig.innerHTML =
      '<div class="' + MEDIA_CLASS + '"><img class="' + IMG_CLASS + '" src="' + p.img +
        '" alt="' + p.name + ' — ' + p.tag + '" /></div>' +
      '<figcaption class="' + CAP_CLASS + '">' +
        '<b class="text-[15px] font-semibold tracking-[-0.01em]">' + p.name + '</b> ' +
        '<span class="text-[14px] font-normal opacity-80">' + p.tag + '</span>' +
      '</figcaption>';
    stage.appendChild(fig);
    return fig;
  });
  var statement = document.querySelector('[data-statement]');
  var N = cards.length;

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!window.gsap || !window.ScrollTrigger || reduce) {
    document.body.classList.add('no-anim');
    return;
  }
  gsap.registerPlugin(ScrollTrigger);
  if (window.ScrollSmoother) {
    gsap.registerPlugin(ScrollSmoother);
    ScrollSmoother.create({
      wrapper: '#smooth-wrapper',
      content: '#smooth-content',
      smooth: 1.4,
      normalizeScroll: true
    });
  }

  var clamp = gsap.utils.clamp;

  /* ── SEQUENCE TIMING (global scroll-progress 0..1) ──
     text mists in first, THEN project 1 enters; each next project starts
     only after the previous one has risen PAST the headline.            */
  var MIST_END = 0.10;        // text fully revealed by here
  var FIRST    = 0.14;        // project 1 starts entering after the text is set
  var OVERLAP  = 0.66;        // next starts at ~66% of prev's run (just past the text)
  var WIN = (1 - FIRST) / ((N - 1) * OVERLAP + 1);
  var STRIDE = OVERLAP * WIN;

  function lerp(a, b, t) { return a + (b - a) * t; }

  function render(p) {
    var vh = window.innerHeight;
    var startY =  0.62 * vh;     // begins below the headline
    var endY   = -0.62 * vh;     // exits above (~translate through ~1000px+)

    /* statement mist — driven by the smoothed value too (subtle float) */
    var mp = clamp(0, 1, p / MIST_END);
    var fadeOut = clamp(0, 1, (p - 0.95) / 0.05);
    gsap.set(statement, {
      opacity: mp * (1 - fadeOut),
      filter: 'blur(' + ((1 - mp) * 24 + fadeOut * 18).toFixed(2) + 'px)',
      scale: 1 + (1 - mp) * 0.04 - fadeOut * 0.02
    });

    for (var i = 0; i < N; i++) {
      var sp = (p - (FIRST + i * STRIDE)) / WIN;
      var y, vis;
      if (sp <= 0)      { y = startY; vis = 0; }
      else if (sp >= 1) { y = endY;   vis = 0; }
      else {
        y = lerp(startY, endY, sp);
        var fin  = clamp(0, 1, sp / 0.14);
        var fout = clamp(0, 1, (1 - sp) / 0.14);
        vis = Math.min(fin, fout);
      }
      gsap.set(cards[i], {
        yPercent: -50,
        y: y,
        autoAlpha: vis
      });
    }
  }

  /* ── LERP float: cards chase the scroll progress with a soft lag,
        giving that drifty "trôi trôi" feel on top of ScrollSmoother. ── */
  var targetP = 0, curP = 0, raf;
  function loop() {
    curP += (targetP - curP) * 0.08;             // ease factor — lower = floatier
    if (Math.abs(targetP - curP) < 0.00015) curP = targetP;
    render(curP);
    raf = requestAnimationFrame(loop);
  }

  ScrollTrigger.create({
    trigger: '.projects',
    start: 'top top',
    end: 'bottom bottom',
    pin: '.projects-stage',
    anticipatePin: 1,
    onUpdate: function (self) { targetP = self.progress; },
    onRefresh: function (self) { targetP = self.progress || 0; }
  });

  render(0);
  loop();
  window.addEventListener('load', function () { ScrollTrigger.refresh(); });
})();
</script>

</body>
</html>
