<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tagline — Water Distortion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root{
    --bg: #f2f2f0;
    --ink: #15161a;
    --muted: #9b9b97;
    --line: rgba(0,0,0,.16);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font); color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: grid; place-items: center;
  }

  /* faint contextual chrome, just to judge the frame in situ */
  .eyebrow {
    position: fixed; top: 28px; left: 0; right: 0; text-align: center;
    font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ink);
  }

  .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .frame {
    position: relative;
    width: clamp(360px, 44vw, 620px);
    aspect-ratio: 3 / 2;
    border: 1px solid var(--line);
    background: var(--bg);
    overflow: hidden;
  }
  /* small corner ticks — quiet Swiss detailing */
  .frame::before, .frame::after {
    content: ""; position: absolute; width: 9px; height: 9px; pointer-events: none;
    border: 1px solid var(--ink); opacity: .55;
  }
  .frame::before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
  .frame::after  { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }

  .frame canvas { display: block; width: 100%; height: 100%; }

  .hint {
    font-size: 10.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted); transition: opacity .4s ease;
  }
  .is-hovering .hint { opacity: .55; }

  /* right-edge nav, vertically centred — echoes the reference layout */
  .menu {
    position: fixed; right: clamp(24px, 4vw, 56px); top: 50%; transform: translateY(-50%);
    text-decoration: none; color: var(--ink);
    font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  }
  .menu::after {
    content: ""; position: absolute; left: 0; right: 100%; bottom: -5px;
    height: 1.5px; background: currentColor;
    transition: right .32s cubic-bezier(.22,.61,.36,1);
  }
  .menu:hover::after { right: 0; }
</style>
</head>
<body>

  <p class="eyebrow">Frontend Developer / Fullstack Developer</p>
  <a class="menu" href="#menu">Menu</a>

  <div class="wrap">
    <div class="frame" data-frame>
      <canvas data-gl></canvas>
    </div>
    <p class="hint" data-hint>Scroll down</p>
  </div>

<script>
(function () {
  var frame  = document.querySelector('[data-frame]');
  var canvas = document.querySelector('[data-gl]');
  var wrap   = document.querySelector('.wrap');
  var LINES  = ['Make Every Pixel', 'Pay for itself'];

  var gl = canvas.getContext('webgl', { premultipliedAlpha: false, antialias: true });

  /* ── offscreen 2D canvas: the crisp text, used as a GL texture ── */
  var tex2d = document.createElement('canvas');
  var t2 = tex2d.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);

  function drawText() {
    var w = frame.clientWidth, h = frame.clientHeight;
    tex2d.width = Math.round(w * DPR); tex2d.height = Math.round(h * DPR);
    t2.setTransform(DPR, 0, 0, DPR, 0, 0);
    t2.clearRect(0, 0, w, h);
    t2.fillStyle = '#f2f2f0'; t2.fillRect(0, 0, w, h);
    t2.fillStyle = '#15161a';
    t2.textAlign = 'center'; t2.textBaseline = 'middle';
    if ('letterSpacing' in t2) t2.letterSpacing = '0px';

    // fit the widest line to ~85% of the frame width (leaves side breathing room)
    t2.font = '600 100px Inter, sans-serif';
    var widest = 0;
    for (var i = 0; i < LINES.length; i++) widest = Math.max(widest, t2.measureText(LINES[i]).width);
    var fs = 100 * (w * 0.85) / widest;
    fs = Math.min(fs, h * 0.26);
    t2.font = '600 ' + fs + 'px Inter, sans-serif';
    var lh = fs * 1.06;
    var startY = h / 2 - lh * (LINES.length - 1) / 2;
    for (var j = 0; j < LINES.length; j++) t2.fillText(LINES[j], w / 2, startY + j * lh);
  }

  /* ── fallback: no WebGL → just show the crisp 2D text ── */
  if (!gl) {
    canvas.replaceWith(tex2d);
    tex2d.style.width = '100%'; tex2d.style.height = '100%'; tex2d.style.display = 'block';
    function fb(){ drawText(); }
    document.fonts.ready.then(fb); window.addEventListener('resize', fb);
    return;
  }

  var VERT = [
    'attribute vec2 aPos;',
    'varying vec2 vUv;',
    'void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }'
  ].join('\n');

  var FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'uniform sampler2D uTex;',
    'uniform vec2 uMouse;',
    'uniform float uTime;',
    'uniform float uStrength;',
    'uniform float uAspect;',
    'void main(){',
    '  vec2 uv = vUv;',
    '  vec2 d = uv - uMouse; d.x *= uAspect;',
    '  float dist = length(d);',
    '  float falloff = exp(-dist*5.0);',                 // ripple stays tight to the cursor
    '  float ripple = sin(dist*26.0 - uTime*4.5) * 0.014 * falloff * uStrength;',
    '  vec2 dir = normalize(uv - uMouse + 1e-6);',
    '  vec2 off = dir * ripple;',
    '  float ca = length(off) * 0.9;',                   // faint chromatic refraction
    '  vec2 base = uv + off;',
    '  float r = texture2D(uTex, base + dir*ca).r;',
    '  float g = texture2D(uTex, base).g;',
    '  float b = texture2D(uTex, base - dir*ca).b;',
    '  gl_FragColor = vec4(r,g,b,1.0);',
    '}'
  ].join('\n');

  function compile(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { window.__shaderErr = gl.getShaderInfoLog(s); }
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var uMouse = gl.getUniformLocation(prog, 'uMouse');
  var uTime = gl.getUniformLocation(prog, 'uTime');
  var uStrength = gl.getUniformLocation(prog, 'uStrength');
  var uAspect = gl.getUniformLocation(prog, 'uAspect');

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  function uploadTexture() {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex2d);
  }

  var W = 0, H = 0;
  function resize() {
    W = frame.clientWidth; H = frame.clientHeight;
    if (!W || !H) return;                            // skip until the frame has a size
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1f(uAspect, W / H);
    drawText(); uploadTexture();
  }

  var mouse = { x: 0.5, y: 0.5 }, target = 0, strength = 0;
  function setMouse(e) {
    var r = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) / r.width;
    mouse.y = 1 - (e.clientY - r.top) / r.height;   // flip to GL (bottom-left origin)
  }
  frame.addEventListener('pointerenter', function (e) { target = 1; wrap.classList.add('is-hovering'); setMouse(e); });
  frame.addEventListener('pointermove', setMouse);
  frame.addEventListener('pointerleave', function () { target = 0; wrap.classList.remove('is-hovering'); });

  var t = 0;
  function loop() {
    if (!W || !H) resize();                          // self-heal if first paint had no size
    t += 0.016;
    strength += (target - strength) * 0.08;          // ease the warp in / out
    gl.uniform1f(uTime, t);
    gl.uniform1f(uStrength, strength);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);
  document.fonts.ready.then(function () { resize(); });
  resize();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
