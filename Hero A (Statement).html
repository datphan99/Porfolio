<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero A — Statement</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root{
    --bg: #ffffff;
    --ink: #15161a;
    --muted: #a7a7a3;
    --green: #2fb863;
    --side: clamp(22px, 4.4vw, 64px);
    --font: "Saira", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; overflow: hidden; text-transform: uppercase; }

  .hero { position: relative; width: 100vw; height: 100vh; overflow: hidden; cursor: none; }

  /* full-bleed WebGL plane (text + logo + water trail) */
  .gl { position: absolute; inset: 0; z-index: 1; display: block; width: 100%; height: 100%; }

  /* corner meta — registration marks */
  .meta { position: absolute; z-index: 3; font-size: 12px; letter-spacing: .04em; color: var(--ink); pointer-events: none; }
  .meta a { pointer-events: auto; }
  .meta.tl { top: var(--side); left: var(--side); }
  .meta.tr { top: var(--side); right: var(--side); text-align: right; }
  .meta.bl { bottom: var(--side); left: var(--side); }
  .meta.br { bottom: var(--side); right: var(--side); text-align: right; }

  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }

  .status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

  .menu { text-decoration: none; color: var(--ink); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; position: relative; }
  .menu::after { content:""; position:absolute; left:0; right:100%; bottom:-4px; height:1.5px; background: currentColor; transition: right .32s cubic-bezier(.22,.61,.36,1); }
  .menu:hover::after { right: 0; }

  .scrollcue { display: inline-flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .scrollcue .ln { width: 30px; height: 1px; background: var(--muted); }

  /* chrome that hides until the visitor is active — show only when needed */
  .veil { opacity: 0; transition: opacity .6s ease; }
  .hero.awake .veil { opacity: 1; }
  /* always-quiet anchors fade in once, after the entrance */
  .quiet { opacity: 0; transition: opacity 1.2s ease; }
  .hero.entered .quiet { opacity: .85; }

  /* custom cursor — a small dot that inverts over ink (the signature) */
  .cursor { position: fixed; left: 0; top: 0; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; mix-blend-mode: difference; transform: translate(-50%,-50%);
    z-index: 60; pointer-events: none; opacity: 0;
    transition: width .28s ease, height .28s ease, opacity .5s ease; }
  .hero.entered .cursor { opacity: 1; }
  .cursor.lg { width: 46px; height: 46px; }
  @media (hover: none) { .hero { cursor: auto; } .cursor { display: none; } }
</style>
</head>
<body>

  <section class="hero" data-hero>
    <canvas class="gl" data-gl></canvas>

    <div class="meta tl quiet"><div class="eyebrow">Frontend / Fullstack</div></div>
    <div class="meta tr veil"><a class="menu" href="#menu">Menu</a></div>
    <div class="meta br quiet"><div class="scrollcue">Scroll <span class="ln"></span></div></div>

    <div class="cursor" data-cursor aria-hidden="true"></div>
  </section>

<script>
(function () {
  var hero = document.querySelector('[data-hero]');
  var canvas = document.querySelector('[data-gl]');
  var LINE1 = 'MAKE EVERY PIXEL';
  var LINE2 = 'PAY FOR ITSELF';

  var gl = canvas.getContext('webgl', { premultipliedAlpha: false, antialias: true });
  var tex2d = document.createElement('canvas');
  var t2 = tex2d.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var INK = '#15161a';
  var logoU = 0.62, logoV = 0.46;   // logo centre in uv (set by drawText)

  function drawLogo(cx, cy, s) {
    // minimalist pixel mark: 2×2 grid, 3 filled + 1 outlined cell
    var cell = s * 0.42, g = s * 0.16;
    var x0 = cx - (cell * 2 + g) / 2, y0 = cy - (cell * 2 + g) / 2;
    t2.fillStyle = INK;
    t2.fillRect(x0, y0, cell, cell);
    t2.fillRect(x0 + cell + g, y0, cell, cell);
    t2.fillRect(x0, y0 + cell + g, cell, cell);
    var lw = Math.max(2, s * 0.085);
    t2.lineWidth = lw; t2.strokeStyle = INK;
    t2.strokeRect(x0 + cell + g + lw / 2, y0 + cell + g + lw / 2, cell - lw, cell - lw);
  }

  function drawText() {
    var w = hero.clientWidth, h = hero.clientHeight;
    if (!w || !h) return;
    tex2d.width = Math.round(w * DPR); tex2d.height = Math.round(h * DPR);
    t2.setTransform(DPR, 0, 0, DPR, 0, 0);
    t2.fillStyle = '#ffffff'; t2.fillRect(0, 0, w, h);
    t2.textAlign = 'left'; t2.textBaseline = 'alphabetic';

    // wider Saira + open tracking + airier line-height so the all-caps breathes
    var TRACK_EM = 0.06;   // letter-spacing as a fraction of font size
    function setFont(px){ t2.font = '600 ' + px + 'px "Saira", sans-serif'; t2.letterSpacing = (px * TRACK_EM) + 'px'; }

    setFont(100);
    var w1 = t2.measureText(LINE1).width;
    var w2 = t2.measureText(LINE2).width;
    var widest = Math.max(w1, w2);
    var fs = 100 * (w * 0.42) / widest;
    fs = Math.min(fs, h * 0.118);
    setFont(fs);
    var track = fs * TRACK_EM;
    w1 = t2.measureText(LINE1).width;
    w2 = t2.measureText(LINE2).width;

    var lineGap = fs * 1.32;   // airier line spacing
    var logoSize = fs * 0.76;
    var logoGap = fs * 0.42;

    var top = (h - lineGap * 2) / 2;
    var base1 = top + fs * 0.80;
    var base2 = base1 + lineGap;

    t2.fillStyle = INK;
    // line 1 centred (subtract trailing track so the glyph run is truly centred)
    t2.fillText(LINE1, (w - (w1 - track)) / 2, base1);
    // line 2 + logo, centred as a unit
    var unitW = (w2 - track) + logoGap + logoSize;
    var startX2 = (w - unitW) / 2;
    t2.fillText(LINE2, startX2, base2);

    var lcx = startX2 + (w2 - track) + logoGap + logoSize / 2;
    var lcy = base2 - fs * 0.34;
    drawLogo(lcx, lcy, logoSize);

    logoU = lcx / w;
    logoV = 1 - lcy / h;   // flip to GL origin
  }

  if (!gl) {
    canvas.replaceWith(tex2d);
    tex2d.style.cssText = 'position:absolute;inset:0;z-index:1;width:100%;height:100%;display:block;';
    var fb = function(){ drawText(); };
    document.fonts.ready.then(fb); window.addEventListener('resize', fb);
    return;
  }

  var VERT = 'attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.0,1.0);}';
  var FRAG = [
    'precision highp float;varying vec2 vUv;',
    'uniform sampler2D uTex;uniform float uTime;uniform float uAspect;',
    'uniform vec2 uLogo;uniform vec3 uTrail[20];',
    'uniform float uReveal;uniform float uBreath;',
    'void main(){',
    '  vec2 uv=vUv;',
    '  vec2 off=vec2(0.0); float hgt=0.0;',
    '  // perpetual logo distortion (no hover needed)',
    '  vec2 dl=uv-uLogo; dl.x*=uAspect; float distL=length(dl);',
    '  float fl=exp(-distL*15.0);',
    '  float phL=distL*55.0 - uTime*3.0;',
    '  vec2 dirL=normalize(uv-uLogo+1e-6);',
    '  off += dirL*sin(phL)*0.010*fl;',
    '  hgt += cos(phL)*0.010*fl;',
    '  // water trail following the cursor across the plane',
    '  for(int i=0;i<20;i++){',
    '    vec3 p=uTrail[i];',
    '    vec2 dd=uv-p.xy; dd.x*=uAspect; float dist=length(dd);',
    '    float fo=exp(-dist*38.0);',
    '    float ph=dist*22.0 - uTime*5.0;',
    '    vec2 dir=normalize(uv-p.xy+1e-6);',
    '    off += dir*sin(ph)*0.018*fo*p.z;',
    '    hgt += cos(ph)*0.018*fo*p.z;',
    '    // small concentric ripples radiating outward',
    '    float fr=exp(-dist*14.0);',
    '    float phr=dist*70.0 - uTime*7.0;',
    '    off += dir*sin(phr)*0.004*fr*p.z;',
    '    hgt += cos(phr)*0.004*fr*p.z;',
    '  }',
    '  // idle breath — a ring expanding from centre when the field rests',
    '  if(uBreath>0.0){',
    '    vec2 bc=uv-vec2(0.5); bc.x*=uAspect; float bd=length(bc);',
    '    float env=sin(uBreath*3.14159);',
    '    float front=exp(-abs(bd-uBreath*0.55)*9.0);',
    '    float wave=sin(bd*30.0-uBreath*26.0);',
    '    vec2 bdir=normalize(uv-vec2(0.5)+1e-6);',
    '    off += bdir*wave*0.015*env*front;',
    '    hgt += cos(bd*30.0-uBreath*26.0)*0.015*env*front;',
    '  }',
    '  // entrance — text condenses out of the mist once',
    '  float rev=clamp(uReveal,0.0,1.0);',
    '  float mist=1.0-rev;',
    '  float n=sin(uv.x*7.0+uTime*0.6)*cos(uv.y*8.0-uTime*0.5);',
    '  off += vec2(n,-n)*0.06*mist;',
    '  vec2 uv2=uv+off;',
    '  float ca=length(off)*0.9;',
    '  vec2 cdir=normalize(off+1e-6);',
    '  float r=texture2D(uTex,uv2+cdir*ca).r;',
    '  float g=texture2D(uTex,uv2).g;',
    '  float b=texture2D(uTex,uv2-cdir*ca).b;',
    '  vec3 col=vec3(r,g,b);',
    '  col += hgt*3.3;',                    // lens reveal: trail visible even on pure white
    '  col = mix(vec3(1.0), col, smoothstep(0.0,1.0,rev));',  // emerge from white mist
    '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
    '}'
  ].join('\n');

  function compile(type, src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) window.__shaderErr=gl.getShaderInfoLog(s); return s; }
  var prog=gl.createProgram();
  gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);
  var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var aPos=gl.getAttribLocation(prog,'aPos'); gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  var uTime=gl.getUniformLocation(prog,'uTime'),uAspect=gl.getUniformLocation(prog,'uAspect'),
      uLogo=gl.getUniformLocation(prog,'uLogo'),uTrail=gl.getUniformLocation(prog,'uTrail'),
      uReveal=gl.getUniformLocation(prog,'uReveal'),uBreath=gl.getUniformLocation(prog,'uBreath');
  var tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  function upload(){ gl.bindTexture(gl.TEXTURE_2D,tex); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,tex2d); }

  // ── cursor trail: ring buffer of recent positions, fading ──
  var TN = 20;
  var trail = new Float32Array(TN * 3);   // x,y,z(strength) per point
  function pushPoint(x, y) {
    for (var i = TN - 1; i > 0; i--) {
      trail[i*3] = trail[(i-1)*3];
      trail[i*3+1] = trail[(i-1)*3+1];
      trail[i*3+2] = trail[(i-1)*3+2];
    }
    trail[0]=x; trail[1]=y; trail[2]=1.0;
  }
  function decay(){ for (var i=0;i<TN;i++) trail[i*3+2] *= 0.95; }

  var W=0,H=0;
  function resize(){
    W=hero.clientWidth; H=hero.clientHeight; if(!W||!H) return;
    canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.uniform1f(uAspect,W/H);
    drawText(); upload();
    gl.uniform2f(uLogo, logoU, logoV);
  }

  // ── interaction state ──
  var lastX=0,lastY=0;
  var revealStart=0, lastMove=performance.now(), lastBreath=performance.now();
  var breathActive=false, breathStart=0;
  var mx=window.innerWidth/2, my=window.innerHeight/2;     // raw cursor px
  var cx=mx, cy=my;                                        // lerped cursor px
  var curEl=document.querySelector('[data-cursor]');
  var awakeTimer=null;

  function wake(){
    hero.classList.add('awake');
    clearTimeout(awakeTimer);
    awakeTimer=setTimeout(function(){ hero.classList.remove('awake'); }, 2600);
  }
  function onMove(e){
    mx=e.clientX; my=e.clientY;
    var r=canvas.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width, y=1-(e.clientY-r.top)/r.height;
    var dx=x-lastX, dy=y-lastY;
    if (dx*dx+dy*dy > 0.00004) { pushPoint(x,y); lastX=x; lastY=y; }
    lastMove=performance.now(); breathActive=false;
    wake();
  }
  window.addEventListener('pointermove', onMove);
  document.addEventListener('pointerover', function(e){ if(e.target.closest('a')) curEl.classList.add('lg'); });
  document.addEventListener('pointerout',  function(e){ if(e.target.closest('a')) curEl.classList.remove('lg'); });

  var t=0, entered=false;
  function loop(){
    if(!W||!H) resize();
    var now=performance.now();
    if(!revealStart) revealStart=now;   // anchor entrance to the first rendered frame
    t+=0.016; decay();

    // entrance: text condenses from mist, once (easeOutCubic)
    var rp=Math.min(1,(now-revealStart)/1900);
    var rev=1-Math.pow(1-rp,3);
    gl.uniform1f(uReveal, rev);
    if(!entered && rp>0.5){ entered=true; hero.classList.add('entered'); }

    // idle breath: when the field has rested, it exhales a ring
    var idle=now-lastMove;
    if(idle>3800 && !breathActive && now-lastBreath>5200 && rev>0.99){ breathActive=true; breathStart=now; }
    var bp=0;
    if(breathActive){ bp=(now-breathStart)/2400; if(bp>=1){ breathActive=false; lastBreath=now; bp=0; } }
    gl.uniform1f(uBreath, bp);

    gl.uniform1f(uTime,t);
    gl.uniform2f(uLogo, logoU, logoV);
    gl.uniform3fv(uTrail, trail);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

    // custom cursor follow (lerp)
    cx+=(mx-cx)*0.22; cy+=(my-cy)*0.22;
    curEl.style.transform='translate('+cx+'px,'+cy+'px) translate(-50%,-50%)';

    requestAnimationFrame(loop);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);
  document.fonts.ready.then(resize);
  resize(); requestAnimationFrame(loop);
})();
</script>

</body>
</html>
